name: Schema tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install jsonschema referencing
      - run: python3 tests/test_schemas.py
      - run: python3 tests/test_vectors.py
